services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: grand_ball
      POSTGRES_USER: ball_owner
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ball_owner -d grand_ball"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://ball_owner:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/grand_ball
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    command:
      [
        sh,
        -c,
        "node scripts/migrate.mjs && node scripts/create-app-role.mjs && node scripts/create-admin.mjs",
      ]
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ball_app:${POSTGRES_APP_PASSWORD}@postgres:5432/grand_ball
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
