# Install only after obtaining a certificate using the HTTP ACME webroot.
server {
    listen 80;
    listen [::]:80;
    server_name nisakt-sc.site www.nisakt-sc.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://nisakt-sc.site$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nisakt-sc.site;
    ssl_certificate /etc/letsencrypt/live/nisakt-sc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nisakt-sc.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    access_log /var/log/nginx/nisakt-sc.access.log;
    error_log /var/log/nginx/nisakt-sc.error.log;
    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nisakt-sc.site;
    ssl_certificate /etc/letsencrypt/live/nisakt-sc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nisakt-sc.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://nisakt-sc.site$request_uri;
}
